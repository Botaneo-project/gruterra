<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Netatmo dans Gruterra : comprendre les deux tokens</title>
  <desc id="desc">Schéma expliquant le rôle du token temporaire et du token de renouvellement Netatmo dans Gruterra.</desc>
  <rect width="1200" height="700" fill="#f6faf6"/>
  <text x="60" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#17412d">Netatmo dans Gruterra : comprendre les 2 tokens</text>
  <text x="60" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#557066">Schéma simplifié — aucune vraie valeur ne doit être partagée ou envoyée sur GitHub.</text>

  <rect x="70" y="170" width="280" height="170" rx="18" fill="#e4f3e8" stroke="#9fb7a5" stroke-width="2"/>
  <text x="105" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17412d">Gruterra</text>
  <text x="105" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#183428">Lit le fichier privé</text>
  <text x="105" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#183428">_config/netatmo_config.json</text>
  <text x="105" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#183428">Puis appelle l’API Netatmo.</text>

  <rect x="455" y="150" width="300" height="210" rx="18" fill="#fff3d9" stroke="#d8ad55" stroke-width="2"/>
  <text x="500" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#8a5a00">Token temporaire</text>
  <text x="500" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#8a5a00">access token</text>
  <text x="490" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#3c3426">Sert à lire les données Netatmo.</text>
  <text x="490" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#3c3426">Il expire régulièrement.</text>
  <text x="490" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#3c3426">S’il est refusé, Gruterra</text>
  <text x="490" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#3c3426">demande un nouveau token.</text>

  <rect x="845" y="150" width="285" height="210" rx="18" fill="#e2efff" stroke="#6e9fd2" stroke-width="2"/>
  <text x="885" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1d4f86">Token durable</text>
  <text x="885" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1d4f86">refresh token</text>
  <text x="875" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#20384f">Sert à renouveler l’accès.</text>
  <text x="875" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#20384f">Il reste privé.</text>
  <text x="875" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#20384f">Il évite de refaire la connexion</text>
  <text x="875" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#20384f">trop souvent.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f6f4e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4673a2"/>
    </marker>
  </defs>
  <line x1="350" y1="255" x2="455" y2="255" stroke="#2f6f4e" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="382" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2f6f4e">utilise</text>
  <line x1="755" y1="255" x2="845" y2="255" stroke="#2f6f4e" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="770" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2f6f4e">si expiré</text>
  <line x1="845" y1="320" x2="755" y2="320" stroke="#4673a2" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="765" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4673a2">nouveau token</text>

  <rect x="210" y="455" width="780" height="165" rx="18" fill="#ffffff" stroke="#cbd8ce" stroke-width="2"/>
  <text x="250" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17412d">À retenir</text>
  <text x="250" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#183428">1. Le fichier de configuration reste local dans _config/.</text>
  <text x="250" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#183428">2. Le token temporaire sert aux appels Netatmo du moment.</text>
  <text x="250" y="601" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#183428">3. Le token de renouvellement permet de récupérer un nouveau token temporaire.</text>
  <text x="250" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#183428">4. Les deux tokens sont privés : ne jamais les copier dans GitHub, Reddit ou une capture publique.</text>
</svg>
